<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700">
  <defs>
    <!-- Solid arrow marker -->
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#000000"/>
    </marker>

    <!-- Dashed arrow marker -->
    <marker id="arrow-dashed" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M 0 1 L 9 5 L 0 9 z" fill="#555555"/>
    </marker>

    <style>
      .font-mono { font-family: 'Geist Mono', 'SF Mono', 'JetBrains Mono', monospace; }
      .font-sans { font-family: 'Geist', -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', Roboto, sans-serif; }
    </style>
  </defs>

  <!-- Canvas Background -->
  <rect width="1100" height="700" fill="#ffffff"/>

  <!-- ==================== HEADER ==================== -->
  <text x="44" y="46" fill="#000000" font-size="10" font-weight="700" class="font-mono" letter-spacing="0.16em">PKG-GATE · PRE-INSTALL SECURITY FLOW</text>
  <text x="44" y="68" fill="#555555" font-size="13" class="font-sans">Lifecycle script inspection, speculative fan-out, and confidence-gated policy routing with TypeSafe System One</text>
  <line x1="44" y1="84" x2="1056" y2="84" stroke="#000000" stroke-width="1"/>

  <!-- ==================== CLUSTER BOUNDARIES ==================== -->
  <!-- Client Runtime Cluster -->
  <rect x="36" y="100" width="550" height="520" rx="12" fill="none" stroke="#000000" stroke-width="1.2"/>
  <rect x="48" y="92" width="158" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="127" y="103" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">LOCAL CLIENT RUNTIME</text>

  <!-- Cloud Boundary Cluster -->
  <rect x="614" y="100" width="276" height="184" rx="12" fill="none" stroke="#000000" stroke-width="1" stroke-dasharray="4,4"/>
  <rect x="626" y="92" width="186" height="16" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="719" y="103" fill="#000000" font-size="8" font-weight="700" class="font-mono" text-anchor="middle" letter-spacing="0.1em">TYPESAFE AI CLOUD (SYSTEM ONE)</text>

  <!-- ==================== CONNECTORS ==================== -->
  <!-- 1. Input -> Extractor -->
  <line x1="184" y1="185" x2="236" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="194" y="176" width="34" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="211" y="187" fill="#000000" font-size="7.5" font-weight="600" class="font-mono" text-anchor="middle">SPEC</text>

  <!-- 2. Extractor -> Decision Diamond -->
  <line x1="376" y1="185" x2="436" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- 3. Decision Diamond -> TypeSafe Cloud (YES path) -->
  <line x1="536" y1="185" x2="634" y2="185" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="548" y="176" width="70" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="583" y="187" fill="#000000" font-size="7.5" font-weight="600" class="font-mono" text-anchor="middle">SCRIPTS FOUND</text>

  <!-- 4. Decision Diamond -> ALLOW (NO path - Fast-path bypass) -->
  <path d="M 486,225 V 582 Q 486,590 494,590 H 914" fill="none" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <rect x="444" y="324" width="84" height="24" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="486" y="335" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">NO SCRIPTS</text>
  <text x="486" y="344" fill="#555555" font-size="7" class="font-mono" text-anchor="middle">0ms fast-path</text>

  <!-- 5. TypeSafe Cloud -> Deterministic Gate -->
  <line x1="752" y1="264" x2="752" y2="352" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="672" y="296" width="160" height="20" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="752" y="306" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">CALIBRATED ANSWERS</text>
  <text x="752" y="313" fill="#555555" font-size="6.5" class="font-mono" text-anchor="middle">Probabilities · Scores · Conf</text>

  <!-- 6. Deterministic Gate -> BLOCK (Branch 1) -->
  <path d="M 860,385 H 882 Q 890,385 890,377 V 348 Q 890,340 898,340 H 914" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="866" y="332" width="48" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="890" y="342" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">SCORE ≥ 2.0</text>

  <!-- 7. Deterministic Gate -> WARN (Branch 2) -->
  <path d="M 860,405 H 882 Q 890,405 890,413 V 442 Q 890,450 898,450 H 914" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="866" y="442" width="48" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="890" y="452" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">CONF &lt; 0.50</text>

  <!-- 8. Deterministic Gate -> ALLOW (Branch 3) -->
  <path d="M 860,425 H 882 Q 890,425 890,433 V 562 Q 890,570 898,570 H 914" fill="none" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <rect x="866" y="562" width="48" height="15" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
  <text x="890" y="572" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">BENIGN</text>

  <!-- ==================== NODES ==================== -->

  <!-- NODE 1: Target Source Input -->
  <g class="node">
    <rect x="52" y="140" width="132" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="60" y="148" width="46" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="83" y="159" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">INPUT</text>
    <text x="118" y="185" fill="#000000" font-size="12.5" font-weight="600" class="font-sans" text-anchor="middle">Package Input</text>
    <text x="118" y="206" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">CLI · Registry · Path</text>
  </g>

  <!-- NODE 2: Manifest Resolver -->
  <g class="node">
    <rect x="244" y="140" width="132" height="90" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="252" y="148" width="58" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="281" y="159" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">RESOLVE</text>
    <text x="310" y="185" fill="#000000" font-size="12.5" font-weight="600" class="font-sans" text-anchor="middle">Hook Extractor</text>
    <text x="310" y="206" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">pre / postinstall</text>
  </g>

  <!-- NODE 3: Decision Diamond -->
  <g class="node">
    <polygon points="486,145 536,185 486,225 436,185" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <text x="486" y="182" fill="#000000" font-size="10" font-weight="600" class="font-sans" text-anchor="middle">Lifecycle</text>
    <text x="486" y="195" fill="#000000" font-size="9" class="font-mono" text-anchor="middle">Hooks?</text>
  </g>

  <!-- NODE 4: THE FOCAL HERO INVERTED NODE (TypeSafe System One Jev) -->
  <g class="node-focal">
    <rect x="634" y="116" width="236" height="148" rx="8" fill="#000000" stroke="#000000" stroke-width="1.2"/>
    
    <!-- Inverted Tag -->
    <rect x="644" y="126" width="88" height="15" rx="3" fill="#000000" stroke="#ffffff" stroke-width="0.8"/>
    <text x="688" y="137" fill="#ffffff" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">SYSTEM ONE · JEV</text>

    <!-- Inverted Title -->
    <text x="752" y="162" fill="#ffffff" font-size="13" font-weight="600" class="font-sans" text-anchor="middle">TypeSafe Engine</text>
    <text x="752" y="178" fill="#aaaaaa" font-size="8.5" class="font-mono" text-anchor="middle">Speculative Fan-Out (~100ms)</text>

    <!-- Battery Primitives list -->
    <line x1="644" y1="190" x2="860" y2="190" stroke="#333333" stroke-width="1"/>
    <text x="652" y="206" fill="#ffffff" font-size="8" class="font-mono">• Choice : script_intent</text>
    <text x="652" y="220" fill="#ffffff" font-size="8" class="font-mono">• Score  : threat_severity (0-3)</text>
    <text x="652" y="234" fill="#ffffff" font-size="8" class="font-mono">• Noul   : accesses_secrets</text>
    <text x="652" y="248" fill="#ffffff" font-size="8" class="font-mono">• Noul   : remote_execution</text>
  </g>

  <!-- NODE 5: Deterministic Policy Gate -->
  <g class="node">
    <rect x="644" y="356" width="216" height="98" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="652" y="364" width="94" height="15" rx="3" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="699" y="375" fill="#000000" font-size="7.5" font-weight="700" class="font-mono" text-anchor="middle">POLICY ARBITER</text>
    <text x="752" y="401" fill="#000000" font-size="12.5" font-weight="600" class="font-sans" text-anchor="middle">Deterministic Gate</text>
    <text x="752" y="420" fill="#555555" font-size="8.5" class="font-mono" text-anchor="middle">Confidence-Gated Routing</text>
    <text x="752" y="434" fill="#777777" font-size="7.5" class="font-mono" text-anchor="middle">Code In Control · Strict Thresholds</text>
  </g>

  <!-- ==================== VERDICT CARDS ==================== -->

  <!-- VERDICT 1: BLOCK -->
  <g class="node">
    <rect x="922" y="306" width="138" height="68" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="930" y="314" width="56" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="958" y="324" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">EXIT 1</text>
    <text x="991" y="347" fill="#000000" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">✖ BLOCK</text>
    <text x="991" y="362" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Critical Threat</text>
  </g>

  <!-- VERDICT 2: WARN -->
  <g class="node">
    <rect x="922" y="416" width="138" height="68" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="930" y="424" width="56" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="958" y="434" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">EXIT 2</text>
    <text x="991" y="457" fill="#000000" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">▲ WARN</text>
    <text x="991" y="472" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Prompt User Review</text>
  </g>

  <!-- VERDICT 3: ALLOW -->
  <g class="node">
    <rect x="922" y="536" width="138" height="68" rx="8" fill="#ffffff" stroke="#000000" stroke-width="1.2"/>
    <rect x="930" y="544" width="56" height="14" rx="2" fill="#ffffff" stroke="#000000" stroke-width="0.8"/>
    <text x="958" y="554" fill="#000000" font-size="7" font-weight="700" class="font-mono" text-anchor="middle">EXIT 0</text>
    <text x="991" y="577" fill="#000000" font-size="12" font-weight="700" class="font-sans" text-anchor="middle">✔ ALLOW</text>
    <text x="991" y="592" fill="#555555" font-size="7.5" class="font-mono" text-anchor="middle">Safe to Install</text>
  </g>

  <!-- ==================== LEGEND SECTION ==================== -->
  <line x1="36" y1="640" x2="1064" y2="640" stroke="#000000" stroke-width="1"/>
  <text x="36" y="666" fill="#000000" font-size="9" font-weight="700" class="font-mono" letter-spacing="0.16em">LEGEND</text>

  <!-- Solid connector -->
  <line x1="120" y1="662" x2="156" y2="662" stroke="#000000" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="166" y="666" fill="#000000" font-size="8.5" class="font-sans">Synchronous Call</text>

  <!-- Dashed connector -->
  <line x1="290" y1="662" x2="326" y2="662" stroke="#000000" stroke-width="1.2" stroke-dasharray="4,4" marker-end="url(#arrow-dashed)"/>
  <text x="336" y="666" fill="#000000" font-size="8.5" class="font-sans">Zero-Token Bypass Path</text>

  <!-- Focal Inverted Box -->
  <rect x="490" y="656" width="16" height="12" rx="2" fill="#000000"/>
  <text x="514" y="666" fill="#000000" font-size="8.5" class="font-sans">TypeSafe System One Hero Node (Jev)</text>

  <!-- Diamond -->
  <polygon points="760,656 767,662 760,668 753,662" fill="#ffffff" stroke="#000000" stroke-width="1"/>
  <text x="777" y="666" fill="#000000" font-size="8.5" class="font-sans">Deterministic Branch</text>
</svg>
